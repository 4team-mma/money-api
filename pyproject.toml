[project]
name = "money-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# 1. 加上 <3.13：避免 langchain-chroma 為了支援未來的 Python 而強制升級 numpy 導致衝突
requires-python = ">=3.12, <3.13"
dependencies = [
    "apscheduler>=3.11.2",
    "bcrypt>=5.0.0",
    "fastapi[all]>=0.127.0",
    "google-auth>=2.47.0",
    "google-genai>=1.62.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-groq>=1.1.2",
    "langchain-huggingface>=1.2.1",
    "langchain-text-splitters>=1.1.1",
    "line-bot-sdk>=3.22.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "pip>=25.3",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.5.0",
    "pytz>=2026.1.post1",
    "reportlab>=4.4.9",
    "requests>=2.32.5",
    "slowapi>=0.1.9",
    "soundfile>=0.13.1",
    "sqlalchemy>=2.0.45",
    # 2. 這是唯一需要跨平台分流的地方：
    # 鎖定 numpy 避免舊版 PyTorch 運算報錯
    "numpy<2.0.0",
    
    # 🌟 新增：解決 ChromaDB 底層依賴的 onnxruntime 也放棄 Intel Mac 的問題
    "onnxruntime>=1.14.1 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "onnxruntime<=1.19.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "user-agents>=2.2.0",
    "xmltodict>=1.0.2",
    "jieba>=0.42.1",
    "customtkinter>=5.2.2",
    "pyinstaller>=6.19.0",
    "cohere>=5.21.1",
    "anthropic>=0.88.0",
    "onnxruntime>=1.19.2",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
    # 稍微放寬 transformers 版本，讓 langchain 自己去抓不會衝突的最新版
    "transformers>=4.39.0",
    # Windows 正常裝 2.5.1；Intel Mac 退回 2.2.2
    "torch>=2.5.1 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio>=2.5.1 ; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "torchaudio==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# ==========================================
# 🌟 PyTorch GPU 專屬下載通道設定
# ==========================================
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# 3. 告訴 uv：在 Mac 上不要去 Windows 的 CUDA 專屬網址找檔案
[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform != 'darwin'" }
]
torchaudio = [
    { index = "pytorch-cu121", marker = "sys_platform != 'darwin'" }
]
