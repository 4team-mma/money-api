name: Backend Team Helper

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened, labeled] # 加入 labeled 確保標籤打上後觸發專案歸類

permissions:
  contents: read
  issues: write
  pull-requests: write
  repository-projects: write # 額外增加專案寫入權限

jobs:
  label-and-project:
    runs-on: ubuntu-latest
    steps:
      - name: 0. 複製專案程式碼
        uses: actions/checkout@v4

      # 處理 PR 的路徑標籤
      - name: 1. 路徑自動標籤 (PR)
        if: github.event_name == 'pull_request'
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler-config.yml

      # 處理 Issue 的關鍵字標籤
      - name: 2. 關鍵字自動標籤 (Issue)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title.toLowerCase();
            let labels = [];
            if (title.includes('bug') || title.includes('錯誤')) labels.push('bug');
            if (title.includes('安全') || title.includes('漏洞')) labels.push('安全性更新');
            if (labels.length > 0) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }

      # 🌟 新增：自動加入專案看板 (編號 1)
      - name: 3. 自動加入數位財務管理系統
        if: github.event_name == 'pull_request'
        uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/orgs/4team-mma/projects/1
          github-token: ${{ secrets.GITHUB_TOKEN }}