name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 複製專案程式碼
      uses: actions/checkout@v4

    - name: 2. 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: "3.12" # 配合你們的 pyproject.toml

    - name: 3. 安裝依賴套件
      run: |
        python -m pip install --upgrade pip
        # 這裡直接安裝 pyproject.toml 裡的 dependencies 和 dev groups
        pip install .
        pip install ".[dev]" 

    - name: 4. 程式碼排版檢查 (Black)
      # 確保每個人寫的 Code 縮排和空格都長得一樣，才不會在 Git 產生沒意義的差異
      run: black --check .

    - name: 5. 程式碼品質掃描 (Ruff)
      # 自動抓出潛在的 Bug 或不規範的寫法 (例如你提到的 E712)
      run: ruff check .

    - name: 6. 執行自動化測試 (Pytest)
      # 確保 API 的邏輯在更新後依然正確
      run: pytest